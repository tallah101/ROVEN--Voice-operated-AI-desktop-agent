# Builds ROVEN-Setup.exe in the cloud on a Windows machine — no Python or tools needed on your PC.
# Push this project to a GitHub repository, open Actions → "Build ROVEN installer" → Run workflow,
# then download the installer from the run's Artifacts (or from Releases when you push a tag like v1.1.0).
name: Build ROVEN installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build ROVEN.exe
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/ROVEN.spec --noconfirm --distpath dist --workpath build
      - name: Bundle speech models
        run: python packaging/fetch_models.py dist/ROVEN/models small tiny
      - name: Smoke test the executable
        shell: pwsh
        run: |
          'print("ok")' | Out-File -Encoding utf8 smoke.py
          $out = & dist\ROVEN\ROVEN.exe --run-script smoke.py | Out-String
          if ($out -notmatch "ok") { throw "ROVEN.exe failed to start: $out" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ROVEN-Setup
          path: dist/ROVEN-Setup-*.exe
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ROVEN-Setup-*.exe
